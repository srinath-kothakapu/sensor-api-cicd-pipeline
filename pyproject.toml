# Tool configuration only; this project is a service, not a package to publish.

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = import order, B = likely bugs
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests do `from app.main import ...` without installing the project.
pythonpath = ["."]
